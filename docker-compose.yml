
services:
  db:
    image: postgres:17
    container_name: learnai-db
    environment:
      POSTGRES_DB: learnai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: $${9509102373}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: learnai-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: dockerfile
    container_name: learnai-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
